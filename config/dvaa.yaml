# Start the fleet first:
#   docker run -d --name dvaa -p 9000:9000 -p 7001-7023:7001-7023 opena2a/dvaa:latest
#
# Agent picks (OpenAI-compatible API agents):
#   LegacyBot  http://localhost:7003  CRITICAL   — everything exploitable
#   HelperBot  http://localhost:7002  WEAK       — overly eager follower
#   RAGBot     http://localhost:7005  WEAK       — injectable knowledge base
#   MemoryBot  http://localhost:7007  VULNERABLE — context/memory poisoning
#   SecureBot  http://localhost:7001  HARDENED   — control: should resist

target_id: dvaa_legacybot

agent_endpoint: http://localhost:7003

corpus_dir: ../promptfuzzr/corpus/seeds

delivery: direct
propagation: single_shot
max_follow_up_turns: 2
concurrency: 4

retry_policy:
  max_retries: 3
  backoff_seconds: 1.0

authority_policy:
  role: support_agent
  allowed_tools:
    - lookup_order
    - get_weather
