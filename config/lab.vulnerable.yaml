target_id: lab_agent
target_profile: vulnerable   # model_provider/model_name are ignored when this is set

corpus_dir: ../promptfuzzr/corpus/seeds

delivery: direct
propagation: single_shot

retry_policy:
  max_retries: 1
  backoff_seconds: 0.5

authority_policy:
  role: support_agent
  allowed_tools:
    - lookup_order
    - get_weather

concurrency: 4
